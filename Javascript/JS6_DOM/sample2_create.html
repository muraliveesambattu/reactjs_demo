<body>

    <button>Click Me</button>
    <script>

        // document.getElementsByTagName("body")[0].appendChild(myHeading)
        // document.createElement("img")
        function showAlert() {
            alert(
                "Hello, I am alert created by JS"
            )
        }

        document.querySelector("button").setAttribute("onclick","showAlert()")
    </script>
</body>

</html>
