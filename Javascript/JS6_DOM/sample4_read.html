<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table {
            width: 50%;
            margin: 0 auto;
        }
    </style>
</head>

<body>
    <table border="1">
        <thead>
            <tr>
                <th>First Name</th>
                <th>Last Name</th>
            </tr>
        </thead>
        <tbody>

        </tbody>
    </table>
    <script>
        var users = [
            {
                fname: "ram",
                lname: "krishna"
            },
            {
                fname: "Ravi",
                lname: "Kumar"
            },
            {
                fname: "sam",
                lname: "Kumar"
            }
        ]

        users.forEach((user) => {
            var myTr = document.createElement("tr");

            // var myTd1 = document.createElement("td");
            // myTd1.innerHTML = user.fname;
            // myTr.appendChild(myTd1);

            // var myTd2 = document.createElement("td");
            // myTd2.innerHTML = user.lname;
            // myTr.appendChild(myTd2);

            // Creating data with template literals 
            myTr.innerHTML = `<td>${user.fname}</td><td>${user.lname}</td>`

            document.querySelector("tbody").appendChild(myTr)
        })
    </script>
</body>

</html>
